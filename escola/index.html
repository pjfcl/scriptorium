<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escola • Scriptorium Digital / Paulolopes.org</title>
    
    <!-- W3.CSS Framework -->
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    
    <!-- Google Fonts: Inter (Sans), Cardo (Serif) & Fira Code (Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Dependências Externas (YAML e Marked) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>

    <style>
        :root {
            --bg-color: #fcfcfc;
            --text-color: #1a1a1a;
            --muted-color: #666666;
            --border-color: #e0e0e0;
            --accent-color: #8b2626; /* Tom terracota / académico */
            --card-bg: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        .font-serif { font-family: 'Cardo', serif; }
        .font-mono { font-family: 'Fira Code', monospace; }
        .font-sans { font-family: 'Inter', sans-serif; }

        .scriptorium-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header.scriptorium-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 15px;
        }

        .site-title {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-color);
            text-decoration: none;
        }

        .site-nav a {
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: var(--muted-color);
            text-decoration: none;
            margin-left: 15px;
            transition: color 0.2s;
        }

        .site-nav a:hover, .site-nav a.active {
            color: var(--accent-color);
        }

        .breadcrumb {
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            color: var(--muted-color);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .breadcrumb a {
            color: var(--accent-color);
            text-decoration: none;
        }

        .entry-card-link {
            text-decoration: none;
            color: inherit;
            display: block;
            margin-bottom: 24px;
        }

        .entry-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 24px;
            transition: border-color 0.2s;
        }

        .entry-card:hover {
            border-color: var(--text-color);
        }

        .entry-meta {
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 8px;
        }

        .entry-card h3 {
            font-family: 'Cardo', serif;
            font-size: 1.5rem;
            margin: 0 0 10px 0;
            color: var(--text-color);
            font-weight: 700;
        }

        .entry-card p {
            color: var(--muted-color);
            font-size: 0.95rem;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .markdown-body {
            font-family: 'Cardo', serif;
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-color);
        }

        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            font-family: 'Inter', sans-serif;
            color: var(--text-color);
            margin-top: 1.5em;
        }

        .markdown-body pre {
            background: #f4f4f4;
            padding: 15px;
            border-radius: 4px;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            overflow-x: auto;
        }

        footer.scriptorium-footer {
            margin-top: 60px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            color: var(--muted-color);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        footer.scriptorium-footer a {
            color: var(--text-color);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="scriptorium-container">
        
        <!-- CABEÇALHO -->
        <header class="scriptorium-header">
            <a href="https://scriptoriumdigital.org" class="site-title font-mono">Scriptorium // Escola</a>
            <nav class="site-nav">
                <a href="../corpus/index.html">Corpus</a>
                <a href="index.html" class="active">Escola</a>
                <a href="../oficina/index.html">Oficina</a>
                <a href="../sobre/index.html">Sobre</a>
                <a href="https://paulolopes.org">&larr; Paulolopes.org</a>
            </nav>
        </header>

        <!-- BREADCRUMB -->
        <div class="breadcrumb" id="breadcrumb-sub">
            <a href="index.html">Escola</a> / Índice de Cadernos e Investigação
        </div>

        <!-- CONTEÚDO DINÂMICO GERADO PELO APP.JS -->
        <main id="escola-content">
            <p class="font-mono w3-small" style="color: var(--muted-color);">A carregar cadernos académicos...</p>
        </main>

        <!-- RODAPÉ -->
        <footer class="scriptorium-footer">
            <span>Paulo Jorge Furtado Cardoso Lopes</span>
            <span><a href="https://paulolopes.org">paulolopes.org</a></span>
        </footer>

    </div>

    <!-- SCRIPT UNIVERSAL DO SCRIPTORIUM -->
    <script src="../app.js"></script>
</body>
</html>
