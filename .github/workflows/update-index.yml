      - name: Executar o Script Chez Scheme
        run: scheme --script generate_index.ss

      - name: Publicar alterações no Repositório (Commit Forçado)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add search-index.json
          # Verifica se há alterações pendentes; se houver, faz commit e push forçado para a branch main
          git status
          git diff --staged --quiet || git commit -m "Auto-atualização do search-index.json via Chez Scheme [skip ci]"
          git push
