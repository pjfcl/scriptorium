name: Atualizar Ecossistema Scriptorium (Chez Scheme)

on:
  push:
    branches:
      - main
    paths:
      - 'md/**/*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Instalar Chez Scheme
        run: sudo apt-get update && sudo apt-get install -y chezscheme

      - name: Executar Scripts Chez Scheme (Manifesto e Índice de Pesquisa)
        run: |
          scheme --script generate_manifest.ss
          scheme --script generate_index.ss

      - name: Publicar alterações no Repositório (Commit Forçado)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json search-index.json
          git status
          git diff --staged --quiet || git commit -m "Auto-atualização do manifest.json e search-index.json via Chez Scheme [skip ci]"
          git push
